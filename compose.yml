# Lembas development and tests. The host needs only Docker, see the Makefile:
#   make test    the suite, in the test image, against the mariadb service
#   make dev     morbo on http://localhost:8080 (cp .env.example .env first)
#   make dev-otel the same with OpenTelemetry: a collector, and Jaeger on http://localhost:16686
x-lembas-env: &lembas-env
    LEMBAS_BASE_URL: ${LEMBAS_BASE_URL:-http://localhost:8080}
    LEMBAS_SHORT_URL: ${LEMBAS_SHORT_URL:-}
    LEMBAS_DB_URL: mariadb://lembas@mariadb/lembas
    LEMBAS_DB_PASSWORD: lembas
    LEMBAS_SECRETS: ${LEMBAS_SECRETS:-development-only-secret}
    LEMBAS_OIDC_CLIENT_ID: ${LEMBAS_OIDC_CLIENT_ID:-}
    LEMBAS_OIDC_CLIENT_SECRET: ${LEMBAS_OIDC_CLIENT_SECRET:-}
    LEMBAS_ALLOWED_DOMAIN: ${LEMBAS_ALLOWED_DOMAIN:-bywatersolutions.com}
    LEMBAS_ADMIN_EMAILS: ${LEMBAS_ADMIN_EMAILS:-}
    LEMBAS_LOG_LEVEL: ${LEMBAS_LOG_LEVEL:-debug}
    # Empty: no telemetry. make dev-otel sets http://otel-collector:4318
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_BSP_SCHEDULE_DELAY: ${OTEL_BSP_SCHEDULE_DELAY:-1000}

services:
    mariadb:
        image: mariadb:11.4
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: lembas
            MARIADB_USER: lembas
            MARIADB_PASSWORD: lembas
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 2s
            timeout: 5s
            retries: 30

    # The repository is bind mounted: edits on the host are tested as they are
    test:
        build:
            context: .
            target: test
        image: lembas-test
        profiles: [test]
        depends_on:
            mariadb:
                condition: service_healthy
        environment:
            # Root: every test process creates and drops its own database
            TEST_ONLINE: mariadb://root:root@mariadb/lembas_test
        volumes:
            - .:/app
        working_dir: /app
        command: ["prove", "-r", "t"]

    dev:
        build:
            context: .
            target: app
        image: lembas-dev
        profiles: [dev]
        depends_on:
            mariadb:
                condition: service_healthy
        environment:
            <<: *lembas-env
            MOJO_MODE: development
        ports:
            - "8080:8080"
        volumes:
            - .:/app
        command: ["morbo", "--listen", "http://*:8080", "--watch", "lib", "--watch", "templates", "--watch", "api", "script/lembas"]

    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.161.0
        profiles: [otel]
        # Root: the collector writes to the otel-out volume
        user: "0:0"
        command: ["--config=/etc/otelcol/config.yaml"]
        volumes:
            - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
            - otel-out:/out
        depends_on:
            - jaeger

    jaeger:
        image: jaegertracing/jaeger:2.21.0
        profiles: [otel]
        ports:
            - "16686:16686"

volumes:
    mariadb-data:
    otel-out:
