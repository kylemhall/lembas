openapi: 3.0.3
info:
    title: Lembas
    version: 1.0.0
    description: >-
        The REST API of Lembas, the URL shortener of ByWater Solutions. Send an API key in the X-Api-Key header, or
        the session cookie of a signed-in user. Errors are {"errors": [{"message": ..., "path": ...}], "status": ...}.
servers:
    - url: /api/v1
security:
    - apiKey: []
    - session: []
paths:
    /me:
        get:
            operationId: get_me
            x-mojo-to: users#me
            summary: The user of the request
            responses:
                "200":
                    description: The user
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Me"
components:
    securitySchemes:
        apiKey:
            type: apiKey
            in: header
            name: X-Api-Key
        session:
            type: apiKey
            in: cookie
            name: lembas
    schemas:
        DefaultResponse:
            type: object
            required: [errors]
            properties:
                errors:
                    type: array
                    items:
                        type: object
                        required: [message]
                        properties:
                            message:
                                type: string
                            path:
                                type: string
                status:
                    type: integer
        Me:
            type: object
            required: [id, email, name, is_admin]
            properties:
                id:
                    type: integer
                email:
                    type: string
                name:
                    type: string
                is_admin:
                    type: boolean
