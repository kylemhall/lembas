name: Release

# A tag vX.Y.Z moves the Unreleased entries of CHANGELOG.md under X.Y.Z on main, and makes a GitHub release of them.
# bws-build.yml builds the image of the tag.
# yamllint disable-line rule:truthy
on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: write

jobs:
    release:
        name: Changelog and release
        runs-on: ubuntu-latest
        steps:
            - name: Check out main
              uses: actions/checkout@v7
              with:
                  ref: main

            - name: Move the Unreleased entries under this version
              id: changelog
              uses: bywatersolutions/github-action-keepachangelog-release@v1
              with:
                  release-tag: ${{ github.ref_name }}

            - name: GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  body: ${{ steps.changelog.outputs.release-notes }}
