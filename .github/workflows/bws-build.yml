name: BWS - Build and push image

# The image of every push to main and of every version tag vX.Y.Z: quay.io/bywatersolutions/lembas:<short sha>, and
# :latest for main (production follows it, see deploy/docker-swarm/lembas-stack.yml), :X.Y.Z for a tag. The checks of
# ci.yml and the smoke test of the built image pass before anything is pushed.
# yamllint disable-line rule:truthy
on:
    push:
        branches:
            - main
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:
        inputs:
            push:
                description: "Push the image to quay.io (false: build and test only)"
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: bws-build-${{ github.ref }}
    cancel-in-progress: true

env:
    IMAGE: quay.io/bywatersolutions/lembas

jobs:
    checks:
        name: Checks
        uses: ./.github/workflows/ci.yml

    build:
        name: Build, smoke test and push
        needs: checks
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Version and tags
              id: version
              run: |
                  short_sha="$(git rev-parse --short=7 HEAD)"
                  tags="$IMAGE:$short_sha"
                  version="$GITHUB_REF_NAME-$short_sha"
                  if [ "$GITHUB_REF" = refs/heads/main ]; then
                      tags="$tags,$IMAGE:latest"
                  fi
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      version="${GITHUB_REF_NAME#v}"
                      tags="$tags,$IMAGE:$version"
                  fi
                  {
                      echo "version=$version"
                      echo "tags=$tags"
                  } >> "$GITHUB_OUTPUT"
                  echo "version=$version tags=$tags"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: app
                  load: true
                  tags: lembas:smoke
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test
              run: script/smoke lembas:smoke

            - name: Log in to quay.io
              if: github.event_name != 'workflow_dispatch' || inputs.push
              uses: docker/login-action@v4
              with:
                  registry: quay.io
                  username: ${{ secrets.QUAY_USERNAME || secrets.QUAY_USER }}
                  password: ${{ secrets.QUAY_PASSWORD }}

            # linux/amd64 like the swarm, Docker v2 manifests and no provenance: what the shepherd of the swarm reads
            - name: Push
              if: github.event_name != 'workflow_dispatch' || inputs.push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: app
                  platforms: linux/amd64
                  outputs: type=image,push=true,oci-mediatypes=false
                  tags: ${{ steps.version.outputs.tags }}
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                  cache-from: type=gha
                  provenance: false
